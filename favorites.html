<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Tus cafés favoritos guardados en Caracas Café."
  />

  <title>Mis favoritos | Caracas Café</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="favorites-page">

  <header class="favorites-header">

    <div class="favorites-header__inner">

      <a class="brand" href="index.html">
        <span
          class="brand__mark"
          aria-hidden="true"
        >
          <span></span>
        </span>

        <div>
          <strong>Caracas Café</strong>
          <small>Descubre Caracas café por café</small>
        </div>
      </a>

      <a
        class="favorites-header__back"
        href="index.html"
      >
        ← Volver a explorar
      </a>

    </div>

  </header>


  <main class="favorites-main">

    <div class="favorites-heading">

      <span class="eyebrow">
        GUARDADOS
      </span>

      <div class="favorites-heading__row">

        <h1>
          Mis cafés favoritos
        </h1>

        <span
          id="favoritesCount"
          class="favorites-count"
        ></span>

      </div>

      <p>
        Aquí encontrarás los cafés que guardaste para visitar más tarde.
      </p>

    </div>


    <section>

      <div
        id="favoritesGrid"
        class="coffee-grid"
      ></div>


      <div
        id="favoritesEmpty"
        class="favorites-empty"
        hidden
      >

        <span class="favorites-empty__heart">
          ♡
        </span>

        <h2>
          Todavía no tienes favoritos
        </h2>

        <p>
          Explora cafés en Caracas y guarda los que quieras visitar.
        </p>

        <a
          href="search.html"
          class="favorites-empty__button"
        >
          Explorar cafés
        </a>

      </div>

    </section>

  </main>


  <script src="favorites.js"></script>
  <script src="favorites-page.js"></script>

</body>
</html>
